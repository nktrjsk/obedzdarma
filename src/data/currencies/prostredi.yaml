order: 3
icon: "🌍"
title: "Životním prostředím"
nav:
  label: "Prostředí"
  cost: "CO₂"
claim: "Nízká cena dnes je vykoupená znečištěnou planetou zítřka."
fact: "Každý Evropan ročně vyhodí v průměru kolem 11 kg textilu."
source:
  label: "Evropský parlament — Dopady výroby a odpadu z textilu na životní prostředí"
  url: "https://www.europarl.europa.eu/topics/cs/article/20201208STO93327/"
examples:
  - name: "Fast fashion"
    note: "Tvoje levné tričko platí někdo jiný — řeky v Bangladéši plné barvicích chemikálií a půda pohřbená pod skládkami textilu."
  - name: "Fosilní paliva"
    note: "Laciná energie, která otepluje klima a způsobuje ostatní nežádoucí jevy."
  - name: "Levné maso"
    note: "U pokladny stojí pár korun. Vodu, emise a vyčerpanou půdu za něj zaplatí všichni ostatní — a později."
  - name: "Doručení „zdarma“"
    note: "Doprava ani vrácení tě nestojí nic. Uhlík každého balíku a hory vráceného zboží, které často skončí rovnou v koši, jsou ten skutečný účet."
