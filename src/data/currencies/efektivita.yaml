order: 2
icon: "⚙️"
title: "Efektivitou"
claim: "Někdo to platí — a obvykle dráž, než kdyby to udělal trh."
fact: "Veřejné výdaje v Česku se dlouhodobě pohybují kolem 45 % HDP."
source:
  label: "Eurostat — General government expenditure (% HDP)"
  url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10a_main/default/table"
examples:
  - name: "Dotace"
    note: "Dotace sice pomáhají zavedeným podnikům, aby nezkrachovaly, ale zároveň berou místo těm, kteří by stejnou věc uměli dělat lépe."
  - name: "Cla"
    note: "Chrání sice domácí výrobce, zato zvyšují ceny všem ostatním a způsobují plýtvání zdroji."
  - name: "Bezplatné zdravotnictví"
    note: "Je zadarmo jen zdánlivě. A i když je zadarmo, čím dál tím víc lidí raději jde k soukromým klinikám. Efektivně tak platí dvakrát."
  - name: "Důchod"
    note: "Všichni mladí už zhruba tuší, že důchod mít nebudou. A to není náhoda, tento systém byl odsouzený ke zkáze už dávno."
  - name: "Bezplatné školství"
    note: "Nejen, že není zdarma — chodit do školy doopravdy baví jen 9 % českých dětí."
    source:
      label: "Zdravá generace — Školní klima (2023)"
      url: "https://zdravagenerace.cz/report/skolni-klima/"
