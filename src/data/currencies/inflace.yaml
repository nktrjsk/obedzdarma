order: 4
icon: "💸"
title: "Inflací"
claim: "Peníze zdarma neexistují — prostě se vypaří."
fact: "Když banka poskytne úvěr, nepůjčuje cizí vklady — vytváří nové peníze."
source:
  label: "Česká národní banka — Jak vznikají peníze v ekonomice"
  url: "https://www.cnb.cz/cs/o_cnb/vlog-cnb/Jak-vznikaji-penize-v-ekonomice/"
examples:
  - name: "Levné peníze"
    note: "Každá půjčka vytváří nové peníze, splátky je zase pálí a odstraňují z koloběhu. A pokud se za rok vytvoří více peněz, než se spálí, peníze všech ostatních se znehodnotí."
  - name: "Inflační daň"
    note: "Inflace neokrádá jen někoho, okrádá všechny, kteří mají úspory v korunách."
